name: Set up installer builder
description: Provision the platform toolchain and synchronize the release version.

inputs:
  target:
    description: Rust compilation target.
    required: true
  release_tag:
    description: Version tag used to synchronize package metadata.
    required: true
  preview:
    description: Whether to use the non-release preview version.
    required: true

runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
          librsvg2-dev patchelf libgtk-3-dev libasound2-dev xdg-utils file

    - uses: pnpm/action-setup@v4
      with:
        dest: ${{ runner.temp }}/setup-pnpm

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Ensure rustup
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Give cargo an isolated home
      if: runner.os != 'Windows'
      shell: bash
      run: echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

    - name: Ensure rustup
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $cargoBin = "$env:USERPROFILE\.cargo\bin"
        if (-not (Test-Path "$cargoBin\rustup.exe")) {
          $init = "$env:TEMP\rustup-init.exe"
          Invoke-WebRequest -UseBasicParsing https://win.rustup.rs/x86_64 -OutFile $init
          & $init -y --no-modify-path --profile minimal --default-toolchain stable
          if ($LASTEXITCODE -ne 0) { throw "rustup-init failed with exit code $LASTEXITCODE" }
        }
        $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

    - name: Ensure perl for vendored OpenSSL
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $perl = "C:\Strawberry\perl\bin\perl.exe"
        if (-not (Test-Path $perl)) {
          winget install --id StrawberryPerl.StrawberryPerl --exact --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          if (-not (Test-Path $perl)) { throw "Strawberry Perl installed but $perl is missing" }
        }
        "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
        "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

    - name: Keep the Windows target directory short
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "CARGO_TARGET_DIR=C:/rbl-target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.99.0
        targets: ${{ inputs.target }}

    - uses: Swatinem/rust-cache@v2
      if: runner.os != 'Windows'
      with:
        cache-bin: false
        key: ${{ inputs.target }}

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Synchronize version from the tag
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
        PREVIEW: ${{ inputs.preview }}
      run: |
        version="${RELEASE_TAG#v}"
        if [ "$PREVIEW" = true ]; then
          version="0.0.0-dev"
        fi
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::invalid release version"
          exit 1
        fi
        echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
        node scripts/sync-version.mjs --version "$version"
