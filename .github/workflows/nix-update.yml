name: Nix flake update

# Monthly: refresh flake.lock, confirm the current seed still runs, and push
# the lock to dev. Kept apart from nix.yml because it needs a write token and
# nix.yml is a reusable workflow called with a read-only one.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

env:
  RBXPORT_TEST: "1"

jobs:
  update:
    name: Refresh flake.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock
        run: nix flake update

      - name: Smoke-test the packaged AppImage
        uses: ./.github/actions/nix-smoke

      - name: Push the refreshed lock
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add flake.lock
            git commit -m "chore(nix): update flake.lock" \
              -m "Monthly nix flake update, validated by the bin smoke test."
            if git push origin HEAD:dev; then exit 0; fi
            git fetch origin dev
            git rebase origin/dev
          done
          echo "::error::could not push the refreshed flake.lock"
          exit 1
