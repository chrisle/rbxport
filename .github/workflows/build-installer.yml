name: Build installer

# Platform-agnostic coordinator. The local actions below own toolchain setup,
# ephemeral signing state, packaging, and verification independently.
on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
      target:
        required: true
        type: string
      bundles:
        required: true
        type: string
      slug:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      preview:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Package
    runs-on: ${{ fromJSON(inputs.host) }}
    env:
      CARGO_TERM_COLOR: always
      HAVE_APPLE: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAVE_AZURE: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME != '' }}
    steps:
      - name: Put Git Bash ahead of the WSL stub
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBin = "$env:ProgramFiles\Git\bin"
          if (-not (Test-Path "$gitBin\bash.exe")) {
            throw "Git for Windows is not installed at $gitBin - bash steps cannot run."
          }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up builder
        uses: ./.github/actions/setup-builder
        with:
          target: ${{ inputs.target }}
          release_tag: ${{ inputs.release_tag }}
          preview: ${{ inputs.preview }}

      - name: Set up signing
        uses: ./.github/actions/setup-signing
        with:
          azure_endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          azure_account_name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          azure_cert_profile: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}
          apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Package installer
        uses: ./.github/actions/package-installer
        with:
          target: ${{ inputs.target }}
          bundles: ${{ inputs.bundles }}
          slug: ${{ inputs.slug }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tauri_signing_private_key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri_signing_private_key_password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify installer
        uses: ./.github/actions/verify-installer
        with:
          apple_id: ${{ secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_PASSWORD }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ inputs.target }}
          path: out/
          retention-days: 90

      - name: Clean up signing
        if: always()
        uses: ./.github/actions/cleanup-signing

  # Opt-in (PACKAGING_NIX): prove the freshly built AppImage that the Nix `bin`
  # package ships runs before a release can publish. Only for the Linux build;
  # the job inside nix.yml is gated on the repository variable.
  nix-smoke:
    name: Nix AppImage smoke test
    needs: build
    if: inputs.slug == 'linux-x86_64'
    uses: ./.github/workflows/nix.yml
    with:
      artifact: installers-${{ inputs.target }}
      source_ref: ${{ inputs.source_ref }}
