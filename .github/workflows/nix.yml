name: Nix packaging

# Builds the Nix `bin` package and smoke-tests the AppImage it ships, on
# GitHub-hosted runners. build-installer calls this with a read-only token, so
# no job here may ask for more; the monthly packaging updates live in
# nix-update.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to smoke-test (blank uses packaging/nix/pin.json)"
        required: false
        type: string
  workflow_call:
    inputs:
      artifact:
        description: "Actions artifact holding a freshly built AppImage (build-installer passes one)"
        required: false
        type: string
      source_ref:
        description: "Commit to test; defaults to the calling ref"
        required: false
        type: string

permissions:
  contents: read

env:
  RBXPORT_TEST: "1"

jobs:
  smoke:
    name: AppImage smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Download the freshly built AppImage
        if: inputs.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: fresh

      - name: Download the dispatched version
        if: inputs.artifact == '' && inputs.version != ''
        run: |
          set -euo pipefail
          mkdir -p fresh
          curl -fsSL --retry 5 --retry-all-errors \
            -o "fresh/rbxport-${{ inputs.version }}-linux-x86_64.AppImage" \
            "https://download.rbxport.com/rbxport-${{ inputs.version }}-linux-x86_64.AppImage"

      - name: Resolve the AppImage
        id: resolve
        run: |
          set -euo pipefail
          appimage=""
          if [ -d fresh ]; then
            appimage="$(find fresh -name '*.AppImage' -print -quit)"
            [ -z "$appimage" ] || appimage="$(realpath "$appimage")"
          fi
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the package and smoke-test its AppImage
        uses: ./.github/actions/nix-smoke
        with:
          appimage: ${{ steps.resolve.outputs.appimage }}
