name: Validate

# This workflow never receives deployment secrets and never runs packaging or
# publication. The callable release workflow owns the validation jobs so CI
# and a release cannot accidentally diverge.
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA or ref to validate (blank uses the selected ref)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    # Self-hosted runners must never execute untrusted fork code. Same-repo
    # pull requests use the complete release gate.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/release.yml
    with:
      source_ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
      validate_only: true
