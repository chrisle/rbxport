name: Release

# Release coordinator. Validation, packaging, publication, and Store submission
# are reusable workflows so this file only describes the release state machine.
on:
  workflow_dispatch:
    inputs:
      skip_version_bump:
        description: "Use current version"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-dev
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  prepare:
    name: Resolve release source
    runs-on: [self-hosted, linux, x64]
    outputs:
      release: ${{ steps.candidate.outputs.release }}
      source_ref: ${{ steps.candidate.outputs.source_ref }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      skip_tests: ${{ steps.candidate.outputs.skip_tests }}
      skip_version_bump: ${{ steps.candidate.outputs.skip_version_bump }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: candidate
        name: Resolve the source and next version
        run: |
          set -euo pipefail
          source="$(git rev-parse HEAD)"
          skip_tests="${{ inputs.skip_tests || false }}"
          skip_version_bump="${{ inputs.skip_version_bump || false }}"
          if [ "${{ github.ref_name }}" != dev ]; then
            echo "::error::Run Release from the dev branch."
            exit 1
          fi
          git fetch origin dev --tags
          if [ "$source" != "$(git rev-parse origin/dev)" ]; then
            echo "::error::dev changed before this release started; its newer push owns the release."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$skip_version_bump" != true ]; then
            current="$(node -p 'require("./package.json").version')"
            if ! git rev-parse -q --verify "refs/tags/v$current^{commit}" >/dev/null; then
              # An earlier run recorded this version but never tagged it.
              cut="$(git log -1 --format=%H --fixed-strings --grep="chore(release): cut $current" HEAD)"
              if [ -z "$cut" ]; then
                echo "::error::v$current is untagged and no release commit records it."
                exit 1
              fi
              git revert --no-edit "$cut"
            fi
          fi
          if [ "$skip_version_bump" = true ]; then
            version="$(node -p 'require("./package.json").version')"
          else
            version="$(node scripts/next-release-version.mjs)"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Releases must use stable semantic versions; got $version."
            exit 1
          fi
          if [ "$skip_version_bump" = true ]; then
            git rev-parse --verify "refs/tags/v$version^{commit}"
            git merge-base --is-ancestor "v$version" "$source"
            node scripts/release-preflight.mjs --version "$version"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::v$version already exists; tags are immutable."
            exit 1
          else
            # Record the version on dev now, so validation covers the exact
            # commit that gets tagged and later merges to dev cannot strand it.
            previous="v$(node -p 'require("./package.json").version')"
            node scripts/sync-version.mjs --version "$version"
            # npm run deploy attaches the curated notes to the source commit as a
            # git note (a dispatch input would be dropped while main lacks it).
            # Without one, notes are derived from the commits.
            if git fetch origin "+refs/notes/release-notes:refs/notes/release-notes" 2>/dev/null \
              && RELEASE_NOTES_JSON="$(git notes --ref release-notes show "$source" 2>/dev/null)"; then
              export RELEASE_NOTES_JSON
            fi
            VERSION="$version" PREVIOUS="$previous" SOURCE_REF="$source" \
              node scripts/generate-release-notes.mjs
            node scripts/release-preflight.mjs --version "$version" --expect-untagged
            git add Cargo.toml Cargo.lock package.json src-tauri/tauri.conf.json release-notes.json
            git commit -m "chore(release): cut $version" \
              -m "Record the version and generated release notes for validation."
            git push origin HEAD:dev
            source="$(git rev-parse HEAD)"
          fi
          {
            echo "release=true"
            echo "source_ref=$source"
            echo "release_tag=v$version"
            echo "skip_tests=$skip_tests"
            echo "skip_version_bump=$skip_version_bump"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  release-source:
    name: Verify release source
    needs: prepare
    if: needs.prepare.outputs.skip_tests != 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release metadata
        run: node scripts/release-preflight.mjs

  validation:
    name: Run shared validation
    needs: [prepare, release-source]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.skip_tests == 'true' || needs.release-source.result == 'success')
    uses: ./.github/workflows/validation.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      skip_tests: ${{ needs.prepare.outputs.skip_tests == 'true' }}
      full: true
      validate_desktop: true

  record:
    name: Record and tag version number
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.release == 'true' && needs.validation.result == 'success' &&
      needs.prepare.outputs.skip_version_bump != 'true'
    needs: [prepare, validation]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    outputs:
      source_ref: ${{ steps.record.outputs.source_ref }}
      release_tag: ${{ steps.record.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: record
        env:
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          # The release commit was pushed to dev before validation; dev may have
          # moved on since, which is fine as long as it still contains it.
          git fetch origin dev --tags
          test "$SOURCE_REF" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SOURCE_REF" origin/dev
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::$RELEASE_TAG already exists; tags are immutable."
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          node scripts/release-preflight.mjs --version "$version" --expect-untagged
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "rbxport $version" "$SOURCE_REF"
          git push origin "$RELEASE_TAG"
          {
            echo "source_ref=$SOURCE_REF"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

  promote:
    name: Fast-forward main
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.release == 'true' && needs.validation.result == 'success' &&
      (needs.record.result == 'success' ||
      (needs.prepare.outputs.skip_version_bump == 'true' && needs.record.result == 'skipped'))
    needs: [prepare, validation, record]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    outputs:
      source_ref: ${{ steps.promote.outputs.source_ref }}
      release_tag: ${{ steps.promote.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - id: promote
        env:
          SOURCE_REF: ${{ needs.record.outputs.source_ref || needs.prepare.outputs.source_ref }}
          RELEASE_TAG: ${{ needs.record.outputs.release_tag || needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch origin dev main
          git merge-base --is-ancestor "$SOURCE_REF" origin/dev
          git merge-base --is-ancestor origin/main "$SOURCE_REF"
          git switch main
          git merge --ff-only "$SOURCE_REF"
          git push origin main
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build ${{ matrix.platform }}
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.release == 'true' &&
      needs.promote.result == 'success'
    needs: [prepare, promote]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - host: [self-hosted, macos, arm64]
            target: aarch64-apple-darwin
            bundles: app,dmg
            slug: darwin-aarch64
            platform: Mac ARM
          - host: [self-hosted, macos, arm64]
            target: x86_64-apple-darwin
            bundles: app,dmg
            slug: darwin-x86_64
            platform: Mac Intel
    uses: ./.github/workflows/build-installer.yml
    secrets: inherit
    with:
      host: ${{ toJSON(matrix.host) }}
      target: ${{ matrix.target }}
      bundles: ${{ matrix.bundles }}
      slug: ${{ matrix.slug }}
      source_ref: ${{ needs.promote.outputs.source_ref }}
      release_tag: ${{ needs.promote.outputs.release_tag }}
      preview: false

  build-other:
    name: Build ${{ matrix.platform }}
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.release == 'true' &&
      needs.promote.result == 'success'
    needs: [prepare, promote]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: [self-hosted, windows, x64]
            target: x86_64-pc-windows-msvc
            bundles: nsis
            slug: windows-x86_64
            platform: Windows
          - host: [self-hosted, linux, x64]
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            slug: linux-x86_64
            platform: Linux
    uses: ./.github/workflows/build-installer.yml
    secrets: inherit
    with:
      host: ${{ toJSON(matrix.host) }}
      target: ${{ matrix.target }}
      bundles: ${{ matrix.bundles }}
      slug: ${{ matrix.slug }}
      source_ref: ${{ needs.promote.outputs.source_ref }}
      release_tag: ${{ needs.promote.outputs.release_tag }}
      preview: false

  publish:
    name: Publish release
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.release == 'true' &&
      needs.promote.result == 'success' && needs.build-macos.result == 'success' &&
      needs.build-other.result == 'success'
    needs: [prepare, promote, build-macos, build-other]
    uses: ./.github/workflows/release-publish.yml
    secrets: inherit
    with:
      source_ref: ${{ needs.promote.outputs.source_ref }}
      release_tag: ${{ needs.promote.outputs.release_tag }}

  store-submit:
    name: Submit Microsoft Store update
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.release == 'true' &&
      needs.promote.result == 'success' && needs.build-other.result == 'success' &&
      needs.publish.result == 'success'
    needs: [prepare, promote, build-other, publish]
    uses: ./.github/workflows/release-store.yml
    secrets: inherit
