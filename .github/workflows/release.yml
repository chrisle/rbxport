name: Release

# This manual workflow is the release authority. It creates the version commit
# and immutable tag only after the candidate passes every validation gate, then
# builds macOS, Windows and Linux, signs the first two where the signing secrets
# exist, and publishes the installers to the R2 bucket as
# `rbxport-1.2.3-<platform>.<ext>` — flat keys, the version in the
# name — plus `latest.json`, so a page can find the newest version without
# a folder listing. Only the 5 most recently published versions are kept;
# publish prunes older ones once the new one is confirmed live.
#
# R2 is the only place a release is published. No GitHub Release is created;
# the bucket is the download and the tag is the source record. Keeping a single
# publication target also makes retention and `latest.json` updates atomic.
#
# Nothing builds until the shared validation gate passes: pinned Clippy, the
# Rust test suite and MSRV check, a Windows-native `cargo check`, and the
# frontend's lint, typecheck, unit tests, bundle budget and Playwright e2e.
# `.github/workflows/ci.yml` calls this workflow in validation-only mode when
# manually dispatched; a release still owns the dependency directly,
# so a separate CI run can never accidentally authorize publication.
#
# Every job runs on the `arc` self-hosted fleet (`self-hosted, <os>, <arch>`),
# one host per platform: an Apple Silicon Mac, a Windows desktop and a Linux
# VM. A hosted image preinstalls a toolchain; an arc host is somebody's actual
# machine, so anything a job needs it installs itself in an idempotent
# "Ensure …" step — a no-op on the second run, and the record of what the host
# needs if it is ever rebuilt.
#
# The signing identity is imported into a throwaway keychain under RUNNER_TEMP
# and removed on the way out rather than being left in a login keychain.
# Discord release announcements use the channel-bound
# `DISCORD_RELEASE_WEBHOOK_URL` repository secret.
on:
  workflow_call:
    inputs:
      # CI passes an immutable SHA so its validation cannot drift while a
      # branch is being updated. Release dispatches continue to use a tag or
      # their selected ref below.
      source_ref:
        required: false
        type: string
      # Reuse the exact release gates before a tag exists. This deliberately
      # skips installer builds, signing, R2 and Discord.
      validate_only:
        required: false
        default: false
        type: boolean
      release_note:
        required: false
        default: ""
        type: string
      version:
        required: false
        default: ""
        type: string
      retry_tag:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      release_note:
        description: "One release note beginning with (New), (Improved), or (Fixed)"
        required: false
        type: string
      version:
        description: "Optional explicit version (for example 1.0.0-rc.13); blank chooses the next RC"
        required: false
        type: string
      retry_tag:
        description: "Existing immutable tag to rebuild and republish after a transient failure"
        required: false
        type: string

concurrency:
  # Real releases must never overlap: they update dev, main, the tag, and the
  # public update feed in that order. Validation-only callers may be superseded.
  group: ${{ inputs.validate_only && format('validate-{0}', github.ref) || 'release-installers' }}
  cancel-in-progress: ${{ inputs.validate_only }}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: [self-hosted, linux, x64]
    outputs:
      release: ${{ steps.candidate.outputs.release }}
      promote: ${{ steps.candidate.outputs.promote }}
      source_ref: ${{ steps.candidate.outputs.source_ref }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      version: ${{ steps.candidate.outputs.version }}
    env:
      RELEASE_NOTE: ${{ inputs.release_note }}
      REQUESTED_VERSION: ${{ inputs.version }}
      RETRY_TAG: ${{ inputs.retry_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: candidate
        name: Create or recover the release candidate
        run: |
          set -euo pipefail
          source="$(git rev-parse HEAD)"
          run_attempt="${{ github.run_attempt }}"
          if [ "${{ inputs.validate_only }}" = true ]; then
            {
              echo "release=false"
              echo "promote=false"
              echo "source_ref=$source"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.ref_name }}" != dev ]; then
            echo "::error::Run Release from the dev branch."
            exit 1
          fi
          git fetch --no-tags origin dev main --tags
          if [ -n "$RETRY_TAG" ]; then
            if [ -n "$RELEASE_NOTE$REQUESTED_VERSION" ] || ! [[ "$RETRY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              echo "::error::retry_tag must be an existing RC tag and cannot be combined with a note or version."
              exit 1
            fi
            source="$(git rev-parse "$RETRY_TAG^{}")"
            if ! git merge-base --is-ancestor "$source" origin/main; then
              echo "::error::$RETRY_TAG is not on main."
              exit 1
            fi
            {
              echo "release=true"
              echo "promote=false"
              echo "source_ref=$source"
              echo "release_tag=$RETRY_TAG"
              echo "version=${RETRY_TAG#v}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$source" != "$(git rev-parse origin/dev)" ]; then
            echo "::error::dev changed before this release started; start a new run."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The release checkout is not clean."
            exit 1
          fi

          current="$(node -e 'const fs=require("fs"); const text=fs.readFileSync("Cargo.toml", "utf8"); const match=/\\[workspace\\.package\\][\\s\\S]*?^version\\s*=\\s*"([^"]+)"/m.exec(text); if (!match) process.exit(1); process.stdout.write(match[1])')"
          if [ "$run_attempt" -gt 1 ] && git tag --points-at HEAD --list "v$current" | grep -qx "v$current"; then
            {
              echo "release=true"
              echo "promote=false"
              echo "source_ref=$source"
              echo "release_tag=v$current"
              echo "version=$current"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            # shellcheck disable=SC2016 # Node owns the quoted JavaScript.
            version="$(node -e '
              const { execFileSync } = require("child_process");
              const fs = require("fs");
              const text = fs.readFileSync("Cargo.toml", "utf8");
              const current = /\\[workspace\\.package\\][\\s\\S]*?^version\\s*=\\s*"(\\d+\\.\\d+\\.\\d+)-rc\\.(\\d+)"/m.exec(text);
              if (!current) throw new Error("workspace version must be an RC");
              const prefix = current[1];
              const tags = execFileSync("git", ["tag", "--list", `v${prefix}-rc.*`], { encoding: "utf8" }).trim().split("\\n").filter(Boolean);
              const highest = tags.reduce((max, tag) => Math.max(max, Number(tag.slice((`v${prefix}-rc.`).length))), Number(current[2]));
              process.stdout.write(`${prefix}-rc.${highest + 1}`);
            ')"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::version must be an RC such as 1.0.0-rc.13"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::v$version already exists; tags are immutable."
            exit 1
          fi
          if ! [[ "$RELEASE_NOTE" =~ ^\((New|Improved|Fixed)\)[[:space:]]+.+ ]]; then
            echo "::error::release_note must begin with (New), (Improved), or (Fixed)."
            exit 1
          fi

          node scripts/sync-version.mjs --version "$version"
          VERSION="$version" node --input-type=module <<'NODE'
          import fs from "node:fs";
          const version = process.env.VERSION;
          const note = process.env.RELEASE_NOTE;
          const file = "release-notes.json";
          const notes = JSON.parse(fs.readFileSync(file, "utf8"));
          if (notes.some((entry) => entry.version === version)) throw new Error(`release notes already contain ${version}`);
          const date = new Date().toISOString().slice(0, 10);
          notes.unshift({ version, date, changes: [note] });
          fs.writeFileSync(file, `${JSON.stringify(notes, null, 2)}\n`);
          NODE
          node scripts/release-preflight.mjs --version "$version" --expect-untagged
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock package.json src-tauri/tauri.conf.json release-notes.json
          git commit -m "chore(release): cut $version" -m "Prepare the validated candidate through the manual Release workflow."
          source="$(git rev-parse HEAD)"
          git push origin HEAD:dev
          if [ "$source" != "$(git ls-remote origin refs/heads/dev | cut -f1)" ]; then
            echo "::error::dev did not advance to the prepared candidate."
            exit 1
          fi
          {
            echo "release=true"
            echo "promote=true"
            echo "source_ref=$source"
            echo "release_tag=v$version"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  release-source:
    name: Verify release source
    needs: prepare
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release metadata
        run: |
          set -euo pipefail
          node scripts/release-preflight.mjs

  # Gate the builds on the same checks CI used to run separately. Folded in
  # here, not left as their own workflow, so a broken build never publishes:
  # a separate CI run had no dependency GitHub Actions could enforce across
  # workflow files. Each of these shares a physical host with a build job
  # below (rust/linux with build-other's Linux leg, windows with its Windows
  # leg, frontend/macos with build-macos) — `needs` on the build jobs forces
  # them to run one after the other on that host instead of racing it.
  rust:
    name: Rust tests
    needs: [prepare, release-source]
    runs-on: [self-hosted, linux, x64]
    env:
      # Tests must never be able to open the installed library read-write.
      # This is the same switch the writer checks.
      RB_LITE_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Install the Linux build dependencies
        # The webview ones are only for the Tauri shell; the rbl-* crates build
        # without a webview, which is the point of keeping tauri out of them.
        # ALSA is not in that category: `rbl-deck` depends on cpal, whose
        # `alsa-sys` build script panics outright without the headers, so the
        # whole workspace failed to compile on Linux without this line.
        run: |
          # ARC runners are isolated, but the host package database is not.
          # Serialize only this host-global provisioning operation; the
          # independent cargo builds can still run concurrently afterwards.
          sudo flock /var/lock/rbxport-ci-apt.lock bash -c '\
            apt-get update && \
            apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
              librsvg2-dev patchelf libgtk-3-dev libasound2-dev'

      # dtolnay/rust-toolchain drives rustup; it does not install it. Hosted
      # images ship rustup, an arc host need not — so install it on first use
      # and put it on PATH for the rest of the job.
      - name: Ensure rustup
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Give cargo a home of its own
        # The host's ~/.cargo is shared with every other job on it, and
        # rust-cache deletes its registry sources when a job ends. See the
        # same step in build-installer.yml.
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # cache-bin caches ~/.cargo/bin and prunes it on restore, which on a
          # self-hosted host means deleting the rustup the step above installed
          # — and the shims every later step resolves through.
          cache-bin: false

      - name: Clippy
        # The workspace denies the lints that matter (unwrap, panic, print,
        # the perf group), so a warning here is a real finding.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # The pinned current toolchain above makes Clippy reproducible. Keep a
  # separate compile lane for the workspace's declared Rust MSRV so advancing
  # lint tooling does not silently change compatibility policy.
  msrv:
    name: Rust MSRV check
    # This shares the Linux ARC host with the current-toolchain Rust gate.
    # Run after it so apt, rustup, and the host cargo cache are never mutated
    # concurrently by two jobs from the same validation run.
    needs: [prepare, rust]
    runs-on: [self-hosted, linux, x64]
    env:
      RB_LITE_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Install the Linux build dependencies
        run: |
          sudo flock /var/lock/rbxport-ci-apt.lock bash -c '\
            apt-get update && \
            apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
              librsvg2-dev patchelf libgtk-3-dev libasound2-dev'

      - name: Ensure rustup
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Give cargo a home of its own
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Check the declared MSRV
        run: cargo +1.89.0 check --workspace --all-targets

  # Check Windows-specific code on the same tags that trigger release builds.
  # `check` catches the platform-specific code; the release builds the installer.
  #
  # It has to run on Windows. Cross-checking from macOS gets as far as the
  # audio and protocol crates — `cargo check -p rbl-deck -p rbl-core
  # -p rbl-prolink -p rbl-pdb --target x86_64-pc-windows-msvc` passes — and
  # then stops at rusqlite's vendored OpenSSL, whose build wants a
  # Windows-native perl.
  windows:
    name: Win compile check
    needs: [prepare, release-source]
    runs-on: [self-hosted, windows, x64]
    steps:
      # `shell: bash` resolves bash from PATH, and on a Windows desktop the
      # WindowsApps WSL stub shadows Git's bash. WSL bash cannot see the
      # runner's workspace under its Windows path, so a bash step would fail on
      # a path that plainly exists. Nothing below uses bash today, but a step
      # added later would inherit the trap, and this costs a second.
      - name: Put Git Bash ahead of the WSL stub
        shell: pwsh
        run: |
          $gitBin = "$env:ProgramFiles\Git\bin"
          if (-not (Test-Path "$gitBin\bash.exe")) {
            throw "Git for Windows is not installed at $gitBin - bash steps cannot run."
          }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Ensure rustup
        # Same reason as the Linux job. The desktop had a rustup-less Rust in
        # ~/.cargo/bin, which is exactly the shape dtolnay/rust-toolchain
        # cannot work with.
        shell: pwsh
        run: |
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          if (-not (Test-Path "$cargoBin\rustup.exe")) {
            $init = "$env:TEMP\rustup-init.exe"
            Invoke-WebRequest -UseBasicParsing https://win.rustup.rs/x86_64 -OutFile $init
            & $init -y --no-modify-path --profile minimal --default-toolchain stable
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed with exit code $LASTEXITCODE" }
          }
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Ensure perl for the vendored OpenSSL
        # rusqlite's `bundled-sqlcipher-vendored-openssl` builds OpenSSL from
        # source, and OpenSSL is configured by a perl script. `cargo check`
        # runs build scripts, so this is needed here and not only at release.
        #
        # Strawberry rather than the perl inside Git for Windows: OpenSSL's
        # Configure emits msys-style paths under that one and the MSVC build
        # then cannot find its own files. OPENSSL_SRC_PERL is read by
        # openssl-src and points it at this interpreter specifically.
        #
        # nasm is deliberately not installed: openssl-src falls back to
        # `no-asm` when it is absent, which is slower crypto in a build that
        # only ever opens a local SQLite file.
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) {
            winget install --id StrawberryPerl.StrawberryPerl --exact --silent `
              --accept-package-agreements --accept-source-agreements --disable-interactivity
            if (-not (Test-Path $perl)) { throw "Strawberry Perl installed but $perl is missing" }
          }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Keep the Windows target directory short
        # The runner's workspace is ~95 characters deep, and openssl-src's
        # copy of the OpenSSL tree underneath `target` pushes its deepest
        # files past MAX_PATH, where they silently fail to copy and Configure
        # reports them "missing". The release build hit this first; the
        # `check` profile's paths are ~30 characters shorter and happened to
        # fit, which is luck, not margin. Same directory as the release uses,
        # and it doubles as this host's persistent build cache.
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=C:/rbl-target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      # No rust-cache here: C:/rbl-target and ~/.cargo both persist on this
      # host, and rust-cache's save step deletes ~/.cargo/registry/src —
      # which left the release's cached build scripts linking against source
      # trees that no longer existed (LNK1181). See release.yml.

      - name: Check
        run: cargo check --workspace --all-targets

  # On the Mac, not the Linux host, because of one test. `e2e/frames.spec.ts`
  # asserts that two playing decks cost under 3 ms more per frame than an idle
  # window, and WebKit on the Linux VM is software-rendered: it measures 10-13 ms
  # there, three times out of three, single-worker or not, while Chromium on the
  # same box passes. Measured, not assumed — and the budget is not the thing to
  # move, because macOS is where the shipped app runs on WKWebView, so this is
  # also the WebKit the number is supposed to be about.
  frontend:
    name: UI tests
    needs: [prepare, release-source]
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      # setup-node, never the host's node: the arc hosts have node under nvm or
      # not at all, and the runner's environment does not see a shell profile.
      - uses: pnpm/action-setup@v4
        with:
          # Its default is `~/setup-pnpm`, one fixed path per host. Two jobs on
          # the same Mac — a CI run and a release, say — both installing there
          # at once is how the first release's macOS build failed before it had
          # done anything: `ENOTEMPTY: directory not empty` from the loser of
          # the race. RUNNER_TEMP belongs to one runner, and each arc runner is
          # its own throwaway.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        # eslint.config.js encodes the frontend architecture rules: no polling,
        # no deep clones of rows, invoke only in src/ipc, and no sorting or
        # filtering a row array in a view.
        run: pnpm lint

      - name: Typecheck and build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Bundle budget
        # perf-budgets.json is enforced, not aspirational.
        run: pnpm budget

      - name: Generated files are up to date
        # tokens.css and icons.tsx are generated and committed; a stale one
        # means the source and the shipped file disagree.
        run: |
          pnpm tokens
          pnpm icons
          git diff --exit-code -- src/styles/tokens.css src/components/icons.tsx

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end
        # Each ARC runner has an isolated checkout but shares one Mac. Give
        # every run a port pair, then serialize the browser-heavy suite so
        # concurrent WebKit/Chromium runs do not starve each other.
        run: |
          lock=/tmp/rbxport-playwright.lock
          until mkdir "$lock" 2>/dev/null; do sleep 2; done
          trap 'rmdir "$lock"' EXIT
          E2E_PORT="$((20000 + GITHUB_RUN_NUMBER % 10000))" pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  promote:
    name: Promote validated candidate
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, rust, msrv, windows, frontend]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    env:
      PROMOTE: ${{ needs.prepare.outputs.promote }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward main and create the immutable tag
        env:
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$PROMOTE" != true ]; then
            echo "Rebuilding existing immutable release tag; branch promotion is not needed."
            exit 0
          fi
          git fetch origin dev main --tags
          test "$SOURCE_REF" = "$(git rev-parse origin/dev)"
          git merge-base --is-ancestor origin/main "$SOURCE_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch main
          git merge --ff-only "$SOURCE_REF"
          git push origin main
          test "$SOURCE_REF" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::$RELEASE_TAG already exists; tags are immutable."
            exit 1
          fi
          git tag -a "$RELEASE_TAG" -m "rbxport ${RELEASE_TAG#v}" "$SOURCE_REF"
          git push origin "$RELEASE_TAG"

  build-macos:
    name: Build ${{ matrix.platform }}
    # Serialize only the Macs: both may share a signing keychain search list.
    # Matrix limits keep the run discoverable by arc (job concurrency marks
    # the whole run pending, which arc does not currently discover).
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, promote]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - host: [self-hosted, macos, arm64]
            target: aarch64-apple-darwin
            bundles: app,dmg
            slug: darwin-aarch64
            platform: Mac ARM
          - host: [self-hosted, macos, arm64]
            target: x86_64-apple-darwin
            bundles: app,dmg
            slug: darwin-x86_64
            platform: Mac Intel
    uses: ./.github/workflows/build-installer.yml
    secrets: inherit
    with:
      host: ${{ toJSON(matrix.host) }}
      target: ${{ matrix.target }}
      bundles: ${{ matrix.bundles }}
      slug: ${{ matrix.slug }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      preview: false

  build-other:
    name: Build ${{ matrix.platform }}
    # Windows and Linux build alongside the serialized Mac jobs.
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, promote]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: [self-hosted, windows, x64]
            target: x86_64-pc-windows-msvc
            bundles: nsis
            slug: windows-x86_64
            platform: Windows
          - host: [self-hosted, linux, x64]
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            slug: linux-x86_64
            platform: Linux
    uses: ./.github/workflows/build-installer.yml
    secrets: inherit
    with:
      host: ${{ toJSON(matrix.host) }}
      target: ${{ matrix.target }}
      bundles: ${{ matrix.bundles }}
      slug: ${{ matrix.slug }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      preview: false

  publish:
    name: Publish to R2
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, build-macos, build-other]
    runs-on: [self-hosted, linux, x64]
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      # The checked-in release notes feed the app, website, and Discord.
      # Nothing else here needs the tree. FIRST, before
      # the installers are downloaded: checkout cleans the workspace, and
      # placed after the download it deleted `out/` — 0.5.1's publish died
      # on `ls: cannot access 'out'` after both builds had passed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          sparse-checkout: |
            release-notes.json
            scripts/release-notes.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: out

      # The steps below build and read latest.json with node. The checkout
      # above puts nothing on PATH, and the arc Linux host's own node is not
      # something a job should depend on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure the AWS CLI
        # A hosted Ubuntu image ships it; the arc Linux host does not. Into
        # ~/.local so no step here needs sudo.
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1 && [ ! -x "$HOME/.local/bin/aws" ]; then
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
            unzip -qo /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install --update -i "$HOME/.local/aws-cli" -b "$HOME/.local/bin"
            rm -rf /tmp/aws /tmp/awscliv2.zip
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish to R2
        # S3-compatible, so the AWS CLI is the whole client. The endpoint is
        # the account's; the bucket is a variable so this file names no account
        # of anyone's.
        #
        # Object keys are FLAT — no `<version>/` or `latest/` prefix, ever. The
        # version is already in every filename, so a folder per version buys
        # nothing and costs a URL nobody can read, type or grep for; one
        # namespace also means a stale prefix cannot shadow a new upload. The
        # build job has already named the files
        # `rbxport-<semver>-<platform>[-setup].<ext>`.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Recent AWS CLI versions attach CRC32 integrity headers that R2
          # rejects with a 400 whose message says nothing useful.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test -n "$BUCKET"
          ls -l out

          # Payloads first, feed second: latest.json must never name a file
          # that has not finished uploading. Immutable caching is safe because
          # a name is never reused — a new version is a new key.
          for f in out/*; do
            # The Partner Center MSIX deliberately has the Store publisher
            # identity and no local signature. Keep it in the Actions
            # artifact for submission; an unsigned package is not a usable
            # direct download and must not be advertised from the CDN.
            case "$f" in *.msix) continue ;; esac
            aws s3 cp "$f" "s3://$BUCKET/$(basename "$f")" \
              --endpoint-url "$ENDPOINT" --no-progress \
              --cache-control "public, max-age=31536000, immutable"
          done

          # The one fixed path in the bucket, and what replaces the `latest/`
          # folder. Two readers: the app's updater, which wants `platforms`
          # in its own shape — one entry per `{os}-{arch}` it runs as, each
          # a signed URL, and `notes` for what changed — and a person or a
          # page, which wants `downloads`: the installers by the platform
          # names the files carry. They are separate because the updater
          # refuses a `platforms` entry without a signature, and a DMG has
          # none. Each Mac architecture gets its own payload and signature.
          # The updater looks for
          # `{os}-{arch}-{installer}` before `{os}-{arch}`, so on Linux the
          # AppImage sits under the plain key and the .deb, when the
          # bundler signed it, under `linux-x86_64-deb`: an app installed
          # from the package takes the package, one run as an AppImage takes
          # the AppImage.
          test -s release-notes.json
          node scripts/release-notes.mjs validate release-notes.json "$version"
          node scripts/release-notes.mjs markdown release-notes.json release-notes.md
          node -e '
            const fs = require("fs");
            const [, version, base] = process.argv;
            const files = fs.readdirSync("out");
            const url = (file) => (base ? base + "/" + file : undefined);
            const signed = (payload, optional = false) => {
              const file = files.find(payload);
              if (!file) return null;
              const sig = file + ".sig";
              if (!files.includes(sig)) {
                if (optional) return null;
                throw new Error("no updater signature beside " + file);
              }
              return { url: url(file), signature: fs.readFileSync("out/" + sig, "utf8").trim() };
            };
            const macArm = signed((f) => f.endsWith("-darwin-aarch64.app.tar.gz"));
            const macIntel = signed((f) => f.endsWith("-darwin-x86_64.app.tar.gz"));
            if (!macArm || !macIntel) throw new Error("both Mac updater builds are required");
            const win = signed((f) => f.endsWith("-setup.exe"));
            const linux = signed((f) => f.endsWith(".AppImage"));
            const deb = signed((f) => f.endsWith(".deb"), true);
            const platforms = {};
            platforms["darwin-aarch64"] = macArm;
            platforms["darwin-x86_64"] = macIntel;
            if (win) platforms["windows-x86_64"] = win;
            if (linux) platforms["linux-x86_64"] = linux;
            if (deb) platforms["linux-x86_64-deb"] = deb;
            const downloads = {};
            for (const [slug, match] of [
              ["darwin-aarch64", (f) => f.endsWith("-darwin-aarch64.dmg")],
              ["darwin-x86_64", (f) => f.endsWith("-darwin-x86_64.dmg")],
              ["windows-x86_64", (f) => f.endsWith("-setup.exe")],
              ["linux-x86_64", (f) => f.endsWith(".AppImage")],
              ["linux-x86_64-deb", (f) => f.endsWith(".deb")],
            ]) {
              const file = files.find(match);
              if (file) downloads[slug] = { file, url: url(file) };
            }
            const feed = {
              version,
              pub_date: new Date().toISOString(),
              notes: fs.readFileSync("release-notes.md", "utf8"),
              platforms,
              downloads,
            };
            fs.writeFileSync("latest.json", JSON.stringify(feed, null, 2) + "\n");
            const { notes, ...shown } = feed;
            console.log(JSON.stringify({ ...shown, notes: notes.length + " bytes" }, null, 2));
          ' "$version" "${CDN_BASE_URL:-}"

          # The public website proxies this canonical history and keeps a
          # checked-in copy only as a fallback for a transient CDN outage.
          aws s3 cp release-notes.json "s3://$BUCKET/release-notes.json" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --content-type application/json --cache-control "public, max-age=60"

          # Short TTL: this is the file anything checking for a new version
          # reads, and a long one delays the rollout by exactly that much.
          aws s3 cp latest.json "s3://$BUCKET/latest.json" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --content-type application/json --cache-control "public, max-age=60"

      - name: Re-fetch what was just published
        # The same request a download page makes, so a bucket that uploaded
        # fine but serves nothing fails the release instead of being found by
        # the first person who clicks a link. Only possible once the bucket has
        # a public base URL; without one there is nothing to fetch.
        if: vars.CDN_BASE_URL != ''
        env:
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # A few retries: a freshly written object is readable at once, but a
          # public domain enabled minutes ago answered 401 for its first ten
          # seconds, and that is a wait, not a failure.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "$CDN_BASE_URL/latest.json" -o published.json
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "$CDN_BASE_URL/release-notes.json" -o published-release-notes.json
          cat published.json
          test "$(node -p 'require("./published.json").version')" = "$version"
          test "$(node -p 'require("./published-release-notes.json")[0].version')" = "$version"
          for url in $(node -p '
            const feed = require("./published.json");
            [...Object.values(feed.platforms), ...Object.values(feed.downloads)].map((p) => p.url).join("\n")
          '); do
            curl -fsI --retry 5 --retry-all-errors --retry-delay 5 "$url" > /dev/null
          done

      - name: Prune old versions
        # Only the 5 most recent versions stay in the bucket; run after the
        # re-fetch check so a broken publish never costs an old, working
        # version. latest.json and anything not named
        # rbxport-<semver>-... are never touched.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 --bucket "$BUCKET" --endpoint-url "$ENDPOINT" \
            --query 'Contents[].Key' --output json > /tmp/keys.json
          node -e '
            const fs = require("fs");
            const keys = JSON.parse(fs.readFileSync("/tmp/keys.json", "utf8")) || [];
            const versions = new Set();
            for (const key of keys) {
              const m = /^rbxport-(\d+\.\d+\.\d+)-/.exec(key);
              if (m) versions.add(m[1]);
            }
            const sorted = [...versions].sort((a, b) => {
              const pa = a.split(".").map(Number);
              const pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pb[i] - pa[i];
              return 0;
            });
            const keep = new Set(sorted.slice(0, 5));
            const drop = keys.filter((key) => {
              const m = /^rbxport-(\d+\.\d+\.\d+)-/.exec(key);
              return m && !keep.has(m[1]);
            });
            console.log("keeping", sorted.slice(0, 5).join(", ") || "(nothing published yet)");
            console.log("deleting", drop.length, "objects from", sorted.slice(5).join(", ") || "(nothing to prune)");
            fs.writeFileSync("/tmp/delete.json", JSON.stringify({ Objects: drop.map((Key) => ({ Key })), Quiet: true }));
          '
          if [ "$(node -p 'require("/tmp/delete.json").Objects.length')" -gt 0 ]; then
            aws s3api delete-objects --bucket "$BUCKET" --endpoint-url "$ENDPOINT" \
              --delete file:///tmp/delete.json
          fi

      # Last on purpose: the release has passed every build, signing, upload,
      # and public-download check before Discord hears about it.
      - name: Send release notes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK_URL"
          version="${RELEASE_TAG#v}"

          node scripts/release-notes.mjs discord release-notes.json "$version" \
            /tmp/discord-release.json https://rbxport.com/whats-new/

          status="$(curl -sS -o /tmp/discord-response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/discord-release.json \
            "$DISCORD_WEBHOOK_URL?wait=true")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Discord webhook failed with HTTP $status"
            sed -n '1,10p' /tmp/discord-response.txt
            exit 1
          fi
          echo "Release notes sent to Discord channel 1552182049832439838"
