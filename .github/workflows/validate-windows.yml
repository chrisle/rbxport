name: Validate Windows

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      check_rust:
        required: false
        default: false
        type: boolean
      check_file_drop:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  windows:
    name: Win compile check
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Put Git Bash ahead of the WSL stub
        shell: pwsh
        run: |
          $gitBin = "$env:ProgramFiles\Git\bin"
          if (-not (Test-Path "$gitBin\bash.exe")) {
            throw "Git for Windows is not installed at $gitBin - bash steps cannot run."
          }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Ensure rustup
        if: inputs.check_rust
        shell: pwsh
        run: |
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          if (-not (Test-Path "$cargoBin\rustup.exe")) {
            $init = "$env:TEMP\rustup-init.exe"
            Invoke-WebRequest -UseBasicParsing https://win.rustup.rs/x86_64 -OutFile $init
            & $init -y --no-modify-path --profile minimal --default-toolchain stable
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed with exit code $LASTEXITCODE" }
          }
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Ensure perl for the vendored OpenSSL
        if: inputs.check_rust
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) {
            winget install --id StrawberryPerl.StrawberryPerl --exact --silent `
              --accept-package-agreements --accept-source-agreements --disable-interactivity
            if (-not (Test-Path $perl)) { throw "Strawberry Perl installed but $perl is missing" }
          }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii

      - name: Keep the Windows target directory short
        if: inputs.check_rust
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=C:/rbl-target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.check_rust
        with:
          toolchain: 1.99.0

      - name: Check
        if: inputs.check_rust
        run: cargo check --workspace --all-targets

      - name: Check silent updater task script
        if: inputs.check_rust
        shell: pwsh
        run: |
          & ./src-tauri/windows/install-update-task.ps1 `
            -InstallDirectory "$env:RUNNER_TEMP/rbxport" -ValidateOnly

      # Backups write, flush and rename files, which Windows treats differently
      # from Unix (handle access rights, open-file locking). Run them natively.
      - name: Backup tests
        if: inputs.check_rust
        shell: pwsh
        env:
          RB_LITE_TEST: "1"
        run: |
          # Cargo's lib-test executable does not get Tauri's app manifest. It
          # imports TaskDialogIndirect, which exists in Common Controls v6 but
          # not the unactivated System32 v5 DLL (0xc0000139 at process start).
          $artifacts = @(cargo test -p rbxport --lib backup --no-run --message-format=json |
            ForEach-Object { if ($_ -match '^\{') { $_ | ConvertFrom-Json } })
          if ($LASTEXITCODE -ne 0) { throw "Backup test build failed: $LASTEXITCODE" }
          $testExe = @($artifacts | Where-Object {
            $_.reason -eq 'compiler-artifact' -and
            $_.target.name -eq 'rbxport_lib' -and $_.executable
          } | Select-Object -Last 1)
          if ($testExe.Count -ne 1 -or -not (Test-Path $testExe[0].executable)) {
            throw 'Cargo did not report the rbxport_lib test executable.'
          }
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $mt = Get-ChildItem $sdkBin -Recurse -Filter mt.exe |
            Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK x64 mt.exe is required for Backup tests.' }
          & $mt.FullName -manifest src-tauri/windows/test-common-controls-v6.manifest `
            "-outputresource:$($testExe[0].executable);#1"
          if ($LASTEXITCODE -ne 0) { throw "Embedding test manifest failed: $LASTEXITCODE" }
          Push-Location src-tauri
          try {
            & $testExe[0].executable backup
            if ($LASTEXITCODE -ne 0) { throw "Backup tests failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - uses: pnpm/action-setup@v4
        if: inputs.check_file_drop
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        if: inputs.check_file_drop
        with:
          node-version: 24
          cache: pnpm
      - if: inputs.check_file_drop
        run: pnpm install --frozen-lockfile

      - name: Check Windows desktop file paths
        if: inputs.check_file_drop
        run: pnpm exec vitest run src/ipc/file-drop.test.ts
