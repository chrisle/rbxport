name: Validate Rust

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      base_ref:
        required: false
        default: ""
        type: string
      full:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RBXPORT_TEST: "1"
  # Debug info made each integration-test binary ~0.8 GB and a job's target/
  # ~24 GB, and six jobs share one disk. Nothing in CI reads it: failures
  # still print panic messages and line numbers. Keep this equal to the
  # autofix job in ci.yml, or the two stop sharing a cache.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    name: Rust tests
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Install the Linux build dependencies
        run: |
          sudo flock /var/lock/rbxport-ci-apt.lock bash -c '\
            apt-get update && \
            apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
              librsvg2-dev patchelf libgtk-3-dev libasound2-dev'

      - name: Ensure rustup
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Give cargo a home of its own
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          shared-key: clippy-linux

      - name: Resolve affected packages
        env:
          BASE_REF: ${{ inputs.base_ref }}
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          if [ "$FULL" = true ] || [ -z "$BASE_REF" ]; then
            echo "RUST_PACKAGES=--workspace" >> "$GITHUB_ENV"
            exit 0
          fi

          metadata="$RUNNER_TEMP/cargo-metadata.json"
          cargo metadata --format-version 1 --no-deps > "$metadata"
          mapfile -t packages < <(
            git diff --name-only -z "$BASE_REF...HEAD" \
              | node scripts/ci/affected-rust-packages.mjs "$metadata"
          )
          echo "RUST_PACKAGES=${packages[*]}" >> "$GITHUB_ENV"

      - name: Check free disk
        run: |
          avail_gb="$(df -BG --output=avail . | tail -1 | tr -dc '0-9')"
          echo "Free disk: ${avail_gb} GB"
          if [ "$avail_gb" -lt 10 ]; then
            echo "::error::Only ${avail_gb} GB free on this runner; a Rust build needs about 10 GB. Free space on the host and re-run."
            exit 1
          fi

      - name: Clippy
        run: |
          read -ra packages <<< "$RUST_PACKAGES"
          if [ "${packages[0]}" = --workspace ]; then
            cargo clippy --workspace --all-targets -- -D warnings
          else
            args=()
            for package in "${packages[@]}"; do args+=(-p "$package"); done
            printf 'Linting affected Rust packages: %s\n' "${packages[*]}"
            cargo clippy "${args[@]}" --all-targets -- -D warnings
          fi

      - name: Tests
        run: |
          set -euo pipefail
          read -ra packages <<< "$RUST_PACKAGES"
          # Examples are only built, never run, by `cargo test`; Clippy's
          # --all-targets already checks that they compile, and building them
          # cost ~8 GB of disk per job. Doctests need their own invocation.
          if [ "${packages[0]}" = --workspace ]; then
            cargo test --workspace --lib --bins --tests
            cargo test --workspace --doc
            exit 0
          fi
          args=()
          for package in "${packages[@]}"; do args+=(-p "$package"); done
          printf 'Testing affected Rust packages: %s\n' "${packages[*]}"
          cargo test "${args[@]}" --lib --bins --tests
          cargo test "${args[@]}" --doc

      - name: Report build size
        if: always()
        run: |
          du -sh target 2>/dev/null || true
          du -sh target/debug/* 2>/dev/null | sort -rh | head -5 || true
          df -h . | tail -1

      - name: Clean the runner
        if: always()
        uses: ./.github/actions/clean-runner

  msrv:
    name: Rust MSRV check
    needs: rust
    if: inputs.full
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Install the Linux build dependencies
        run: |
          sudo flock /var/lock/rbxport-ci-apt.lock bash -c '\
            apt-get update && \
            apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
              librsvg2-dev patchelf libgtk-3-dev libasound2-dev'

      - name: Ensure rustup
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Give cargo a home of its own
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Check the declared MSRV
        run: cargo +1.89.0 check --workspace --all-targets

      - name: Clean the runner
        if: always()
        uses: ./.github/actions/clean-runner
