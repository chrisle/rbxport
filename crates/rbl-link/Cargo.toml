[package]
name = "rbl-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Link export: the library served to players over Pro DJ Link, as rekordbox serves it."

[lints]
workspace = true

[dependencies]
# The player's side of the protocol, as chrisle/alphatheta-connect knows it:
# interface discovery with MAC addresses, and the CDJ status packet, which
# is how we learn which player has loaded which of our tracks.
alphatheta-connect = { git = "https://github.com/chrisle/alphatheta-connect-rs", rev = "b54d9e9c53059f11e04f4de9898f4abae3b46480", default-features = false }
# The same crate alphatheta-connect lists interfaces with (and, on Apple
# targets, the interface index the pin takes). `link-local` is on for every
# target because Cargo unifies features: without it, if-addrs drops
# 169.254.x.x IPv4 addresses on Windows, which is where a Pioneer USB LINK
# adapter (XDJ-RX3) with no DHCP lease lives (#408).
if-addrs = { version = "0.15", features = ["link-local"] }
parking_lot = "0.12"
rbl-anlz = { path = "../rbl-anlz" }
rbl-db = { path = "../rbl-db" }
rbl-dbserver = { path = "../rbl-dbserver" }
rbl-index = { path = "../rbl-index" }
rbl-nfs = { path = "../rbl-nfs" }
rbl-prolink = { path = "../rbl-prolink" }
# `all` for the interface pins (`IP_BOUND_IF`, `SO_BINDTODEVICE`).
socket2 = { version = "0.6", features = ["all"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation = "0.10"
system-configuration-sys = "0.6"

[dev-dependencies]
# The emulator fixture (`examples/emu_fixture.rs`) analyses its own WAVs so
# the deck has a grid and waveforms to draw.
rbl-analysis = { path = "../rbl-analysis" }
rbl-audio = { path = "../rbl-audio" }
rbl-fakecdj = { path = "../rbl-fakecdj" }
serde_json = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
