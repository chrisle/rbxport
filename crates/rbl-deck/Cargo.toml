[package]
name = "rbl-deck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Not the workspace's MIT: a default build links the vendored Rubber Band
# Library, and the combined work is distributable only under the GPL. See
# LICENSING.md; `--no-default-features` is the MIT build.
license = "GPL-2.0-or-later"
description = "The playback engine: decks, the audio device, and the clock the interface reads."

[lints]
workspace = true

[features]
# The Rubber Band backend, and with it the licence: Rubber Band R3 is
# GPL-or-commercial, so a build with this on is distributable under the GPL and
# nothing else. On by default because that is the decision that was taken; a
# build that must not carry the GPL turns it off and falls back to the WSOLA
# backend written for this crate, which stretches tempo well enough and cannot
# shift a key accurately.
default = ["rubberband"]
rubberband = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
cpal = "0.18"
rtrb = "0.4"
rubato = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "alac", "isomp4", "flac", "wav", "aiff", "pcm", "adpcm"] }
rbl-core = { path = "../rbl-core" }

[dev-dependencies]
tempfile = "3"
# The load probe walks the installed library; the engine itself needs neither.
rbl-db = { path = "../rbl-db" }
rbl-index = { path = "../rbl-index" }
# Encodes the LAME MP3 the timeline tests play.
rbl-audio = { path = "../rbl-audio" }
