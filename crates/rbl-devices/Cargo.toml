[package]
name = "rbl-devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Finds removable media and reads what is already exported to it."

[lints]
workspace = true

[dependencies]
rbl-core = { path = "../rbl-core" }
rbl-export = { path = "../rbl-export" }
rbl-onelibrary = { path = "../rbl-onelibrary" }
rbl-pdb = { path = "../rbl-pdb" }
dirs = "5"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
rbl-anlz = { path = "../rbl-anlz" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Ioctl"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFURL", "CFDictionary"] }
objc2-disk-arbitration = { version = "0.3", default-features = false, features = ["std", "DADisk", "DASession"] }
